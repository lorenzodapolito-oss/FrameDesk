[package]
name = "framedesk"
version = "0.1.0"
edition = "2021"
description = "FrameDesk - analizzatore di qualità video: compressione, dettaglio reale, stabilità, voto e report"
authors = ["Lorenzo D'Apolito"]
license = "MIT"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wgpu", "wayland", "x11"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
rustfft = "6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
